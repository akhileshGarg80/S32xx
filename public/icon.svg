<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="4" />

  <!-- Shield / Test Canvas Icon -->
  <g transform="translate(96, 88)">
    <!-- Base card -->
    <rect x="20" y="30" width="280" height="280" rx="40" fill="#1e293b" stroke="#334155" stroke-width="6" />
    
    <!-- Code brackets (Uploader) -->
    <path d="M 90 140 L 50 170 L 90 200" fill="none" stroke="url(#sky-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 230 140 L 270 170 L 230 200" fill="none" stroke="url(#sky-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center Checkmark (Tester) -->
    <circle cx="160" cy="170" r="54" fill="#064e3b" stroke="url(#emerald-grad)" stroke-width="8" filter="url(#glow)" />
    <path d="M 140 170 L 154 184 L 182 154" fill="none" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Top badge bar -->
    <rect x="70" y="65" width="80" height="16" rx="8" fill="#38bdf8" opacity="0.8" />
    <rect x="170" y="65" width="80" height="16" rx="8" fill="#34d399" opacity="0.8" />
  </g>
</svg>
